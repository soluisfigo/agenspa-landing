<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pago recibido — AgenSpa IA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;line-height:1.6;background:linear-gradient(160deg,#2b0719 0%,#4A0D2B 50%,#6d1238 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:520px}
.check{width:96px;height:96px;border-radius:50%;margin:0 auto 28px;background:linear-gradient(135deg,#BE185D,#EC4899);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(236,72,153,.3)}
.check svg{width:48px;height:48px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800;color:#FFF;margin-bottom:16px;letter-spacing:-0.5px}
p{color:#EBC5D6;font-size:17px;margin-bottom:14px}
.note{font-size:14px;color:#D3A2B8;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
<h1>¡Pago recibido!</h1>
<p>Tu anticipo quedó registrado. En unos minutos te llega la confirmación de tu cita por WhatsApp, con la dirección y el mapa.</p>
<p>Ya puedes cerrar esta página.</p>
<p class="note">Si no recibes la confirmación, escríbele al spa por el mismo WhatsApp.</p>
</div>
</body>
</html>
