<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — AgenSpa IA</title>
<meta name="description" content="Contáctanos. Equipo de AgenSpa IA disponible por WhatsApp y email para resolver tus dudas.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#1E293B;line-height:1.7;background:#F8FAFC;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:560px;margin:0 auto;padding:60px 24px;text-align:center}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:#4A0D2B;margin-bottom:12px;letter-spacing:-0.5px}
.sub{color:#475569;font-size:17px;margin-bottom:40px}
.cards{display:grid;gap:16px;margin-bottom:32px}
.card{background:#FFF;border:1px solid #E2E8F0;border-radius:14px;padding:24px;text-align:left;transition:all .25s;display:flex;align-items:center;gap:16px}
.card:hover{border-color:#BE185D;box-shadow:0 4px 20px rgba(190,24,93,.08);transform:translateY(-2px)}
.card .icon{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(190,24,93,.08),rgba(236,72,153,.08));display:flex;align-items:center;justify-content:center;font-size:22px}
.card h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;color:#4A0D2B;margin-bottom:2px}
.card p{font-size:14px;color:#475569}
.card a{color:#BE185D;text-decoration:none}
.card a:hover{text-decoration:underline}
.back{display:inline-block;margin-top:16px;font-size:14px;color:#94A3B8;text-decoration:none}
.back:hover{color:#BE185D}
</style>
</head>
<body>
<div class="wrap">
<h1>Hablemos</h1>
<p class="sub">Estamos aquí para resolver tus dudas. Elige el canal que prefieras y te respondemos en menos de 24 horas.</p>

<div class="cards">
<a href="mailto:hola@agendent.mx" class="card">
<div class="icon">✉️</div>
<div><h3>Email</h3><p>hola@agendent.mx</p></div>
</a>
<a href="https://wa.me/525576155941" class="card">
<div class="icon">💬</div>
<div><h3>WhatsApp</h3><p>+52 55 7615 5941</p></div>
</a>
<a href="mailto:soporte@agendent.mx" class="card">
<div class="icon">🛟</div>
<div><h3>Soporte (clientes activos)</h3><p>soporte@agendent.mx</p></div>

</div>

<a href="/" class="back">← Volver al inicio</a>
</div>
</body>
</html>
